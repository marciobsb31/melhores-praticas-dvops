# ====================================================================
# SonarQube Scanner Configuration - Unyleya Unidade 2
# Aluno: Márcio Pereira | Repositório: marciobsb31/melhores-praticas-dvops
# ====================================================================

# Identificação do Projeto
sonar.projectKey=melhores-praticas-dvops
sonar.projectName=melhores-praticas-dvops - Marcio Pereira
sonar.projectVersion=1.0.0
sonar.projectDescription=Pipeline CI/CD Automatizada com Jenkins e SonarQube - Unyleya DevOps

# Estrutura de Código Fonte e Testes
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusões
sonar.exclusions=node_modules/**,coverage/**,public/**
sonar.test.inclusions=tests/**/*.test.js

# Relatório de Cobertura de Código (LCOV gerado pelo Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Critérios do Quality Gate
sonar.qualitygate.wait=true
