version: '3.8'

services:
  # ============================================================================
  # SERVIÇO: Web App - Ambiente Local de Desenvolvimento (DEV)
  # ============================================================================
  webapp-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webapp-dev-marcio
    restart: always
    environment:
      - NODE_ENV=development
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # SERVIÇO: Web App - Ambiente Local de Produção (PRD)
  # ============================================================================
  webapp-prd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webapp-prd-marcio
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # SERVIÇO: Jenkins CI/CD Controller
  # ============================================================================
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-marcio-custom:latest
    container_name: jenkins-marcio
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS="--prefix="
      - JAVA_OPTS="-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins_data:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-network


  # ============================================================================
  # SERVIÇO: SonarQube Server - Code Quality & Security
  # ============================================================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-marcio
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
    name: devops-network-unyleya

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
